<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Microphone diagnostic</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  button { font-size: 16px; padding: 10px 20px; margin: 10px 0; cursor: pointer; }
  #log { white-space: pre-wrap; background: #f4f4f4; border: 1px solid #ccc; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 13px; min-height: 200px; }
  .ok { color: #0a7a2f; font-weight: bold; }
  .err { color: #c0392b; font-weight: bold; }
</style>
</head>
<body>
<h1>Microphone diagnostic (no Gradio involved)</h1>
<p>This page tests only the raw browser microphone APIs, completely
independent of the MediGuide app. Click the button, allow the
microphone if prompted, speak for a couple of seconds, then check the
log below.</p>
<button id="btn">Test microphone</button>
<div id="log">Click the button to start...</div>

<script>
const log = document.getElementById('log');
const btn = document.getElementById('btn');

function line(text, cls) {
  const span = document.createElement('div');
  if (cls) span.className = cls;
  span.textContent = text;
  log.appendChild(span);
}

btn.addEventListener('click', async () => {
  log.innerHTML = '';
  line('isSecureContext: ' + window.isSecureContext);
  line('location: ' + window.location.href);

  try {
    line('Enumerating devices before permission...');
    const before = await navigator.mediaDevices.enumerateDevices();
    line('Found ' + before.filter(d => d.kind === 'audioinput').length + ' audio input device(s) (labels may be hidden until permission is granted)');

    line('Requesting getUserMedia({audio:true})...');
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    line('getUserMedia resolved successfully.', 'ok');

    const tracks = stream.getAudioTracks();
    line('Audio tracks: ' + tracks.length);
    tracks.forEach((t, i) => {
      line(`  Track ${i}: label="${t.label}" enabled=${t.enabled} muted=${t.muted} readyState=${t.readyState}`);
      line(`  Settings: ${JSON.stringify(t.getSettings())}`);
    });

    if (!window.MediaRecorder) {
      line('MediaRecorder API is NOT available in this browser.', 'err');
      return;
    }

    line('Starting MediaRecorder for 3 seconds...');
    const chunks = [];
    const mr = new MediaRecorder(stream);
    mr.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    mr.onerror = (e) => line('MediaRecorder error: ' + e.error, 'err');

    mr.start();
    await new Promise(r => setTimeout(r, 3000));
    mr.stop();

    await new Promise(r => { mr.onstop = r; });

    const blob = new Blob(chunks, { type: mr.mimeType });
    line(`Recording finished: ${blob.size} bytes, mimeType=${mr.mimeType}`, blob.size > 0 ? 'ok' : 'err');

    if (blob.size > 0) {
      const url = URL.createObjectURL(blob);
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = url;
      log.appendChild(audio);
      line('Playable recording added below the log — press play to confirm audio was actually captured.', 'ok');
    }

    stream.getTracks().forEach(t => t.stop());
  } catch (err) {
    line('FAILED: ' + err.name + ' — ' + err.message, 'err');
  }
});
</script>
</body>
</html>
